sections:
  intro:
  - text: 国家海外高层次引进青年人才，同济大学测绘与地理信息学院和 城市交通研究院 长聘 教授，多伦多都会大学（瑞尔森大学）客座教授，日本庆应义塾大学Global Professor。现任国际摄影测量与遥感学会（ISPRS）Human Behaviour, Mobility and Socio-Spatial Dynamics（WG IV/7）工作组主席，中国测绘学会“地图学与地理信息系统”专业委员会委员 ，中国科协联合国咨商国土空间规划与地理信息专业委员会委员， ISPRS International Journal of Geo-Information 副主编， 测绘学报（英文版） 编委。2018年8月-2021年2月在加拿大安大略省交通部工作，2016年12月-2018年7月在 德国海德堡GIScience研究所 进行博士后研究工作。2016年获得加拿大瑞尔森大学GIS方向博士学位，2011年获得中南大学地图学与地理信息系统专业硕士学位，2008年获得北京化工大学计算机科学与技术专业学士学位。2016年获国际摄影测量与遥感学会（ISPRS） The U.V. Helava Award Best Paper 。
    url: https://umi.tongji.edu.cn/index.htm
  recruitment:
  - text: 如果你对具身智能，城市空间智能理解，城市人类活动模式挖掘， 人-机-环境交互等方向 感兴趣，欢迎申请攻读博士、硕士研究生；也欢迎优秀的在校本科生申请课题组实习机会！招生要求如下：
    url: null
  - text: 具有但不限于测绘地理信息、计算机、自动化、交通工程、城市规划、应用数学、统计等背景
    url: null
  - text: 具有令人羡慕的自我驱动力
    url: null
  - text: 对世界仍然怀有一颗好奇心、喜欢异想天开、追求完美者有加分
    url: null
  - text: 致力于改变未来人类城市出行和人机交互方式者有加分
    url: null
  - text: 【NEW！！】 拟招收2027级博士研究生2名，研究方向：
    url: null
  - text: 1. 城市行人空间多模态智能理解AI模型研究
    url: null
  - text: 2. 城市环境与人类日常出行行为的交互研究
    url: null
