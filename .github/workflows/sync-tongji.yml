name: Daily sync Tongji profile

on:
  schedule:
    # 22:00 UTC = 06:00 Beijing time, once a day
    - cron: "0 22 * * *"
  workflow_dispatch: # allow manual runs

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 pyyaml

      - name: Run sync script
        run: python scripts/sync_tongji.py

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: daily sync of Tongji faculty profile [skip ci]"
            git push
          fi
