name: Daily sync Google Scholar publications

on:
  schedule:
    # 01:30 UTC = 09:30 Beijing time, once a day
    - cron: "30 1 * * *"
  workflow_dispatch: # allow manual runs

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 pyyaml

      - name: Run Scholar sync script
        run: python scripts/sync_scholar.py

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: daily sync of Google Scholar publications [skip ci]"
            git push
          fi
